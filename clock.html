<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Digital Clock</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            height: 100vh;\n            background-color: #f0f0f0;\n        }\n        .clock {\n            font-size: 48px;\n            margin-bottom: 20px;\n        }\n    </style>\n</head>\n<body>\n    <div class="clock" id="clock"></div>\n    <script>\n        function updateClock() {\n            const now = new Date();\n            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);\n            const eastern = new Date(utc + (3600000 * -5)); // UTC-5\n            const central = new Date(utc + (3600000 * -6)); // UTC-6\n            const mountain = new Date(utc + (3600000 * -7)); // UTC-7\n            const pacific = new Date(utc + (3600000 * -8)); // UTC-8\n            const clockDisplay = \`Eastern: \${eastern.toLocaleTimeString()} | Central: \${central.toLocaleTimeString()} | Mountain: \${mountain.toLocaleTimeString()} | Pacific: \${pacific.toLocaleTimeString()}\`;\n            document.getElementById('clock').innerHTML = clockDisplay;\n        }\n        setInterval(updateClock, 1000);\n        updateClock();\n    </script>\n</body>\n</html>
